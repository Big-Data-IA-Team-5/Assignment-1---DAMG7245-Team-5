stages:
  parse:
    cmd: .venv/bin/python src/text/extract_text.py --in data/raw/tesla.pdf --out data/intermediate/
    deps:
    - src/text/extract_text.py
    - data/raw/
    outs:
    - data/intermediate/text/
    desc: Parse PDF text extraction with OCR fallback

  tables:
    cmd: .venv/bin/python src/tables/extract_tables.py --in data/raw/tesla.pdf --out data/intermediate/ --hybrid
    deps:
    - src/tables/extract_tables.py
    - src/tables/
    - data/raw/
    - data/intermediate/text/
    outs:
    - data/intermediate/tables/
    desc: Extract tables using hybrid Camelot + pdfplumber approach

  layout:
    cmd: .venv/bin/python src/layout/extract_layout.py --in data/raw/tesla.pdf --out data/intermediate/
    deps:
    - src/layout/extract_layout.py
    - data/raw/
    - data/intermediate/text/
    - data/intermediate/tables/
    outs:
    - data/intermediate/layout/
    desc: Detect and analyze document layout structure

  docling:
    cmd: .venv/bin/python src/docling/extract_docling.py --in data/raw/tesla.pdf --out data/intermediate/
    deps:
    - src/docling/extract_docling.py
    - data/raw/
    - data/intermediate/text/
    - data/intermediate/tables/
    - data/intermediate/layout/
    outs:
    - data/intermediate/docling/
    desc: Advanced document analysis with Docling

  export:
    cmd: >
      .venv/bin/python src/metadata/extract_metadata.py --in data/raw/ --out data/intermediate/ --unified-dir data/intermediate/ &&
      .venv/bin/python src/formats/convert_formats.py --in data/intermediate/metadata/ --out data/intermediate/
    deps:
    - src/metadata/extract_metadata.py
    - src/formats/convert_formats.py
    - data/raw/
    - data/intermediate/text/
    - data/intermediate/tables/
    - data/intermediate/layout/
    - data/intermediate/docling/
    outs:
    - data/intermediate/metadata/
    - data/intermediate/formats/
    desc: Export metadata and convert to multiple formats (JSON, Markdown, TXT)
