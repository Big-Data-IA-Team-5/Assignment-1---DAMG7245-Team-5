name: DVC Pipeline Smoke Test

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for DVC

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install minimal requirements for smoke test
        pip install dvc pytest pyyaml
        # Install additional dependencies if needed
        if [ -f requirements.txt ]; then
          # Install only essential packages to speed up CI
          pip install pdfplumber pandas numpy
        fi

    - name: Verify DVC installation
      run: |
        dvc --version
        dvc config --list

    - name: Check DVC pipeline structure
      run: |
        # Verify DVC files exist and are valid
        test -f dvc.yaml || (echo "❌ Missing dvc.yaml" && exit 1)
        test -f dvc.lock || (echo "❌ Missing dvc.lock" && exit 1) 
        test -f data/raw.dvc || (echo "❌ Missing data/raw.dvc" && exit 1)
        
        # Validate DVC pipeline syntax
        dvc dag --ascii || (echo "❌ Invalid DVC pipeline" && exit 1)
        
        echo "✅ DVC pipeline structure is valid"

    - name: Run DVC smoke test
      run: |
        # Run the lightweight smoke test
        python tests/test_dvc_pipeline.py
        echo "✅ DVC smoke test completed"

    - name: Check pipeline reproducibility
      run: |
        # Verify pipeline can be analyzed without running
        dvc status || echo "⚠️  DVC status check completed"
        
        # Check if pipeline stages are defined correctly
        python -c "
        import yaml
        with open('dvc.yaml', 'r') as f:
            config = yaml.safe_load(f)
        stages = config.get('stages', {})
        print(f'✅ Found {len(stages)} pipeline stages: {list(stages.keys())}')
        assert len(stages) >= 5, f'Expected at least 5 stages, got {len(stages)}'
        "

    - name: Validate requirements.txt
      run: |
        # Check that requirements.txt is parseable
        python -c "
        with open('requirements.txt', 'r') as f:
            lines = [line.strip() for line in f if line.strip() and not line.startswith('#')]
        print(f'✅ Requirements.txt contains {len(lines)} packages')
        assert len(lines) > 50, 'Expected comprehensive requirements file'
        "

    - name: Summary
      if: always()
      run: |
        echo "🎯 DVC Pipeline Smoke Test Summary"
        echo "================================="
        echo "✅ Pipeline structure validated"
        echo "✅ DVC configuration verified" 
        echo "✅ Dependencies checked"
        echo "✅ Smoke tests passed"
        echo ""
        echo "📊 Pipeline is ready for data processing!"